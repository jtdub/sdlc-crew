# sdlc-crew configuration. The sdlc-setup skill writes this file for you.
# You can also edit it by hand. Every key has a default, so you can delete a key
# that you do not need.

version: 1

# Who uses the workflow. This changes how much the personas explain.
#   new          - explain every term, offer fewer options, add safety steps
#   some         - explain uncommon terms only
#   professional - assume a software developer
person:
  experience: new

# Where the work items live.
#   local     - a BACKLOG.md file in this repository (no account needed)
#   github    - GitHub Issues of the repository in forge.repo
#   gitlab    - GitLab Issues of the project in tracker.project
#   jira      - Jira Cloud or Jira Server; tracker.url and tracker.project are required
#   bitbucket - Bitbucket Cloud issues of the repository in forge.repo
tracker:
  kind: local
  url: ""
  project: ""
  statuses:
    todo: "To Do"
    in_progress: "In Progress"
    in_review: "In Review"
    done: "Done"
  child_issue_type: "Subtask"

# Where the code and the pull requests live.
#   github | gitlab | bitbucket | none
# With none, the workflow makes branches and commits but opens no pull request.
# worktree_dir is where the crew makes one git worktree for each pull request.
# The crew never changes the branch or the files of your own checkout.
forge:
  kind: github
  repo: ""
  default_branch: ""
  branch_pattern: "sdlc/{id}-{slug}"
  worktree_dir: "../{repo}-worktrees"
  assign_to_me: true

# Which model each role uses. The value is a model name that your harness accepts,
# "inherit" for the model of the current session, or "ask" to choose at the start
# of each run, for work where data rules limit which model can read the code.
#   plan   - the architect
#   build  - the engineer
#   review - QA, UX, and the sdlc-review skill
models:
  plan: inherit
  build: inherit
  review: inherit

# How to run and test the project. Leave a value empty if the project has none yet.
project:
  run_command: ""
  test_command: ""
  app_url: ""
  changelog: none
  screenshots: pr-comment
  # Local files that git ignores and that the app or the tests need, such as .env.
  # The crew copies them into each new worktree. It never commits them.
  local_files: [".env"]

# A review of the plan by reviewers that did not see the conversation, before you
# approve the plan.
#   auto  - the Elephant-Goldfish Model (EGM) reviewers if installed, else the built-in reviewer
#   egm   - the EGM reviewers
#   fresh - the built-in reviewer
#   none  - no review
plan_review: auto

# Limits that keep a change reviewable.
limits:
  max_pr_lines: 500
  max_qa_rounds: 3
  max_ci_rounds: 3

# The sdlc-loop skill. It does one pass: it acts on an open crew pull request, or
# takes the next ready item to a pull request. The harness repeats the pass.
#   ready_label             - set by the loop script when all blockers of an item are closed
#   skip_labels             - the loop never picks an item with one of these labels
#   needs_human_label       - added by the loop when an item needs a decision of a person
#   human_merge_label       - the loop never turns on auto-merge for these items
#   max_waiting_for_person  - the loop stops when this many crew pull requests wait for a person
#   merge_method            - squash | merge | rebase, for auto-merge
#   order                   - milestone | priority | number, in the order to compare
#   priority_labels         - the highest priority first
#   lock_stale_hours        - after this age the loop reports the lock of a pass as stale
loop:
  ready_label: "status:ready"
  skip_labels: ["needs-human", "type:epic"]
  needs_human_label: "needs-human"
  human_merge_label: "human-merge"
  max_waiting_for_person: 3
  merge_method: squash
  order: [milestone, priority, number]
  priority_labels: ["priority:p0", "priority:p1", "priority:p2"]
  lock_stale_hours: 6
